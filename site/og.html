<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./og.css" />
    <title>Here social cover</title>
  </head>
  <body>
    <main class="og-canvas">
      <header class="og-brand"><img src="/here-mark.svg" alt="" /><strong>here</strong></header>
      <section class="og-copy">
        <p>업무 맥락 복원</p>
        <h1>왜 열었는지,<br /><em>다음에 뭘 할지.</em></h1>
        <span>끊긴 업무를 다시 시작할 한 지점</span>
      </section>
      <section class="og-product" aria-label="Here 복원 결과 예시">
        <div class="og-windowbar"><i></i><i></i><i></i><span>Here · 맥락 복원</span></div>
        <div class="og-result">
          <p>이 창으로 돌아옴 · 방금</p>
          <h2>Q3_예산검토.xlsx로<br />3분 만에 돌아왔어요.</h2>
          <div class="og-path">Teams <b>→</b> Excel <b>→</b> Outlook <b>→</b> Excel</div>
          <div class="og-actions">
            <div><span>이 창을 연 이유</span><strong>Q3 예산안 숫자 확인</strong></div>
            <div><span>이어서 할 일</span><strong>비용 증감 합계 확인</strong></div>
          </div>
          <button type="button">Here 닫고 이 창 계속 <b>→</b></button>
        </div>
      </section>
      <footer>Windows-first · OpenAI-compatible vLLM</footer>
    </main>
  </body>
</html>
