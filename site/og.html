<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./og.css" />
    <title>Here social cover</title>
  </head>
  <body>
    <main class="og-canvas">
      <header class="og-brand"><img src="/here-mark.svg" alt="" /><strong>here</strong></header>
      <section class="og-copy">
        <p>업무 맥락 복원</p>
        <h1>왜 열었는지,<br /><em>다음에 뭘 할지.</em></h1>
        <span>끊긴 업무를 다시 시작할 한 지점</span>
      </section>
      <section class="og-product" aria-label="Here 복원 결과 예시">
        <div class="og-windowbar"><i></i><i></i><i></i><span>Here · 맥락 복원</span></div>
        <div class="og-result">
          <p>맥락 복원 · 방금</p>
          <h2>김OO님의 A sample 질문에<br />답하던 중이었어요.</h2>
          <div class="og-path">Slack <b>→</b> Finder <b>→</b> Excel</div>
          <div class="og-actions">
            <div><span>다시 시작할 곳</span><strong>Sample A · Condition B</strong></div>
            <div><span>다음 한 단계</span><strong>Condition B 결과 확인</strong></div>
          </div>
          <button type="button">이 지점에서 계속 <b>→</b></button>
        </div>
      </section>
      <footer>Windows-first · OpenAI-compatible vLLM</footer>
    </main>
  </body>
</html>
