name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows (NSIS + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Smoke-test Windows native foreground reader
        timeout-minutes: 2
        run: npm run test:windows-reader

      - name: Package Windows installers
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: here-windows
          retention-days: 14
          path: |
            release/**/*.exe
          if-no-files-found: error

  macos:
    name: macOS (DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package DMG
        shell: bash
        run: npm run dist:mac

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: here-macos
          retention-days: 14
          path: |
            release/**/*.dmg
          if-no-files-found: error

  publish-latest:
    name: Publish direct downloads
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: downloaded

      - name: Prepare stable asset names
        shell: bash
        run: |
          mkdir -p publish
          find downloaded/here-windows -type f -name '*-Setup.exe' -exec cp '{}' publish/Here-Windows-x64-Setup.exe \;
          find downloaded/here-windows -type f -name '*-Portable.exe' -exec cp '{}' publish/Here-Windows-x64-Portable.exe \;
          find downloaded/here-macos -type f -name '*.dmg' -exec cp '{}' publish/Here-macOS-arm64.dmg \;
          test -s publish/Here-Windows-x64-Setup.exe
          test -s publish/Here-Windows-x64-Portable.exe
          test -s publish/Here-macOS-arm64.dmg
          cd publish
          sha256sum Here-Windows-x64-Setup.exe Here-Windows-x64-Portable.exe Here-macOS-arm64.dmg > SHA256SUMS.txt

      - name: Move rolling release tag
        shell: bash
        run: |
          retry_gh() {
            local attempt=1
            local max_attempts=5
            until "$@"; do
              if (( attempt >= max_attempts )); then
                echo "GitHub API call failed after ${max_attempts} attempts." >&2
                return 1
              fi
              local delay=$((attempt * 5))
              echo "GitHub API call failed; retrying in ${delay}s (${attempt}/${max_attempts})." >&2
              sleep "${delay}"
              attempt=$((attempt + 1))
            done
          }

          if retry_gh gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/latest-build" >/dev/null; then
            retry_gh gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest-build" -f sha="${GITHUB_SHA}" -F force=true
          else
            retry_gh gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref='refs/tags/latest-build' -f sha="${GITHUB_SHA}"
          fi

      - name: Publish rolling GitHub Release
        shell: bash
        run: |
          retry_gh() {
            local attempt=1
            local max_attempts=5
            until "$@"; do
              if (( attempt >= max_attempts )); then
                echo "GitHub release command failed after ${max_attempts} attempts." >&2
                return 1
              fi
              local delay=$((attempt * 5))
              echo "GitHub release command failed; retrying in ${delay}s (${attempt}/${max_attempts})." >&2
              sleep "${delay}"
              attempt=$((attempt + 1))
            done
          }

          notes="Automated desktop build from main at ${GITHUB_SHA}. Download the installer for your operating system below."
          if retry_gh gh release view latest-build --repo "${GITHUB_REPOSITORY}" >/dev/null; then
            retry_gh gh release edit latest-build --repo "${GITHUB_REPOSITORY}" --title 'Here — Latest automatic build' --notes "${notes}" --prerelease
            retry_gh gh release upload latest-build publish/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            retry_gh gh release create latest-build publish/* --repo "${GITHUB_REPOSITORY}" --title 'Here — Latest automatic build' --notes "${notes}" --prerelease --latest=false
          fi

      - name: Add download links to the run summary
        shell: bash
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-build"
          {
            echo '## Download the latest Here build'
            echo
            echo "- [Windows installer](${base}/Here-Windows-x64-Setup.exe)"
            echo "- [Windows portable](${base}/Here-Windows-x64-Portable.exe)"
            echo "- [macOS DMG](${base}/Here-macOS-arm64.dmg)"
            echo "- [SHA-256 checksums](${base}/SHA256SUMS.txt)"
          } >> "${GITHUB_STEP_SUMMARY}"

  publish-version:
    name: Publish versioned release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: downloaded

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${package_version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}." >&2
            exit 1
          }

      - name: Prepare versioned assets
        shell: bash
        run: |
          mkdir -p publish
          find downloaded/here-windows -type f -name '*-Setup.exe' -exec cp '{}' publish/Here-Windows-x64-Setup.exe \;
          find downloaded/here-windows -type f -name '*-Portable.exe' -exec cp '{}' publish/Here-Windows-x64-Portable.exe \;
          find downloaded/here-macos -type f -name '*.dmg' -exec cp '{}' publish/Here-macOS-arm64.dmg \;
          test -s publish/Here-Windows-x64-Setup.exe
          test -s publish/Here-Windows-x64-Portable.exe
          test -s publish/Here-macOS-arm64.dmg
          cd publish
          sha256sum Here-Windows-x64-Setup.exe Here-Windows-x64-Portable.exe Here-macOS-arm64.dmg > SHA256SUMS.txt

      - name: Publish GitHub Release for tag
        shell: bash
        run: |
          retry_gh() {
            local attempt=1
            local max_attempts=5
            until "$@"; do
              if (( attempt >= max_attempts )); then
                echo "GitHub release command failed after ${max_attempts} attempts." >&2
                return 1
              fi
              local delay=$((attempt * 5))
              echo "GitHub release command failed; retrying in ${delay}s (${attempt}/${max_attempts})." >&2
              sleep "${delay}"
              attempt=$((attempt + 1))
            done
          }

          title="Here ${GITHUB_REF_NAME}"
          notes="Automated desktop release from ${GITHUB_SHA}. Download an installer below and verify it with SHA256SUMS.txt."
          if retry_gh gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null; then
            retry_gh gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${title}" --notes "${notes}" --latest
            retry_gh gh release upload "${GITHUB_REF_NAME}" publish/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            retry_gh gh release create "${GITHUB_REF_NAME}" publish/* --repo "${GITHUB_REPOSITORY}" --title "${title}" --notes "${notes}" --verify-tag --latest
          fi

      - name: Add version downloads to the run summary
        shell: bash
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          {
            echo "## Download Here ${GITHUB_REF_NAME}"
            echo
            echo "- [Windows installer](${base}/Here-Windows-x64-Setup.exe)"
            echo "- [Windows portable](${base}/Here-Windows-x64-Portable.exe)"
            echo "- [macOS DMG](${base}/Here-macOS-arm64.dmg)"
            echo "- [SHA-256 checksums](${base}/SHA256SUMS.txt)"
          } >> "${GITHUB_STEP_SUMMARY}"
