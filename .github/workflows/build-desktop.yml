name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows (NSIS + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package Windows installers
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: here-windows
          retention-days: 14
          path: |
            release/**/*.exe
          if-no-files-found: error

  macos:
    name: macOS (DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package DMG
        shell: bash
        run: npm run dist:mac

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: here-macos
          retention-days: 14
          path: |
            release/**/*.dmg
          if-no-files-found: error

  publish-latest:
    name: Publish direct downloads
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: downloaded

      - name: Prepare stable asset names
        shell: bash
        run: |
          mkdir -p publish
          find downloaded/here-windows -type f -name '*-Setup.exe' -exec cp '{}' publish/Here-Windows-x64-Setup.exe \;
          find downloaded/here-windows -type f -name '*-Portable.exe' -exec cp '{}' publish/Here-Windows-x64-Portable.exe \;
          find downloaded/here-macos -type f -name '*.dmg' -exec cp '{}' publish/Here-macOS-arm64.dmg \;
          test -s publish/Here-Windows-x64-Setup.exe
          test -s publish/Here-Windows-x64-Portable.exe
          test -s publish/Here-macOS-arm64.dmg
          cd publish
          sha256sum Here-Windows-x64-Setup.exe Here-Windows-x64-Portable.exe Here-macOS-arm64.dmg > SHA256SUMS.txt

      - name: Move rolling release tag
        shell: bash
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/latest-build" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest-build" -f sha="${GITHUB_SHA}" -F force=true
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref='refs/tags/latest-build' -f sha="${GITHUB_SHA}"
          fi

      - name: Publish rolling GitHub Release
        shell: bash
        run: |
          notes="Automated desktop build from main at ${GITHUB_SHA}. Download the installer for your operating system below."
          if gh release view latest-build --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit latest-build --repo "${GITHUB_REPOSITORY}" --title 'Here — Latest automatic build' --notes "${notes}" --prerelease
            gh release upload latest-build publish/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create latest-build publish/* --repo "${GITHUB_REPOSITORY}" --title 'Here — Latest automatic build' --notes "${notes}" --prerelease --latest=false
          fi

      - name: Add download links to the run summary
        shell: bash
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-build"
          {
            echo '## Download the latest Here build'
            echo
            echo "- [Windows installer](${base}/Here-Windows-x64-Setup.exe)"
            echo "- [Windows portable](${base}/Here-Windows-x64-Portable.exe)"
            echo "- [macOS DMG](${base}/Here-macOS-arm64.dmg)"
            echo "- [SHA-256 checksums](${base}/SHA256SUMS.txt)"
          } >> "${GITHUB_STEP_SUMMARY}"
